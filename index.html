<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#062e3f">
    <title>Just Do It - To Do List</title>

    <!-- Font e Icone -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.0-2/css/all.min.css">

    <style>
        /* Stile Grafico (CSS) Integrato */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Work Sans', sans-serif;
            background-color: #062e3f;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            font-size: 2rem;
            margin-top: 10vh;
            margin-bottom: 2rem;
        }
        form {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
        }
        form input, form button {
            padding: 10px;
            font-size: 1.2rem;
            border: none;
            background: white;
            outline: none;
        }
        form input {
            flex: 1;
            border-radius: 5px 0 0 5px;
        }
        form button {
            color: #062e3f;
            background: #f4f4f4;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 0 5px 5px 0;
            font-weight: 600;
        }
        form button:hover {
            background: #d88771;
            color: white;
        }
        .todo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .todo-list {
            min-width: 100%;
            list-style: none;
        }
        .todo {
            margin: 0.5rem 0;
            background: white;
            color: black;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .todo-item {
            flex: 1;
            padding: 10px;
            word-break: break-word;
        }
        .trash-btn, .complete-btn {
            background: #ff6f47;
            color: white;
            border: none;
            padding: 15px;
            cursor: pointer;
            font-size: 1rem;
            outline: none;
        }
        .complete-btn {
            background: rgb(73, 204, 73);
        }
        .fa-trash, .fa-check {
            pointer-events: none;
        }
        .completed {
            text-decoration: line-through;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <header>
        <h1 id="title">Just do it.</h1>
    </header>

    <form>
        <input class="todo-input" type="text" placeholder="Aggiungi una task...">
        <button class="todo-btn" type="submit"><i class="fas fa-plus"></i></button>
    </form>

    <div class="todo-container">
        <ul class="todo-list"></ul>
    </div>

    <script>
        // Motore Logico (JavaScript) Integrato
        const todoInput = document.querySelector('.todo-input');
        const todoButton = document.querySelector('.todo-btn');
        const todoList = document.querySelector('.todo-list');

        document.addEventListener('DOMContentLoaded', getTodos);
        todoButton.addEventListener('click', addTodo);
        todoList.addEventListener('click', deleteCheck);

        function addTodo(event) {
            event.preventDefault(); 
            if(todoInput.value.trim() === '') return;

            const todoDiv = document.createElement('div');
            todoDiv.classList.add('todo');

            const newTodo = document.createElement('li');
            newTodo.innerText = todoInput.value;
            newTodo.classList.add('todo-item');
            todoDiv.appendChild(newTodo);

            saveLocalTodos(todoInput.value);

            const completedButton = document.createElement('button');
            completedButton.innerHTML = '<i class="fas fa-check"></i>';
            completedButton.classList.add('complete-btn');
            todoDiv.appendChild(completedButton);

            const trashButton = document.createElement('button');
            trashButton.innerHTML = '<i class="fas fa-trash"></i>';
            trashButton.classList.add('trash-btn');
            todoDiv.appendChild(trashButton);

            todoList.appendChild(todoDiv);
            todoInput.value = '';
        }

        function deleteCheck(e) {
            const item = e.target;
            const todo = item.closest('.todo');

            if (item.classList.contains('trash-btn')) {
                removeLocalTodos(todo);
                todo.remove();
            }

            if (item.classList.contains('complete-btn')) {
                todo.classList.toggle('completed');
                updateLocalTodos();
            }
        }

        function saveLocalTodos(todo) {
            let todos = localStorage.getItem('todosData') ? JSON.parse(localStorage.getItem('todosData')) : [];
            todos.push({ text: todo, completed: false });
            localStorage.setItem('todosData', JSON.stringify(todos));
        }

        function getTodos() {
            let todos = localStorage.getItem('todosData') ? JSON.parse(localStorage.getItem('todosData')) : [];
            todos.forEach(function(todoObj) {
                const todoDiv = document.createElement('div');
                todoDiv.classList.add('todo');
                if (todoObj.completed) {
                    todoDiv.classList.add('completed');
                }

                const newTodo = document.createElement('li');
                newTodo.innerText = todoObj.text;
                newTodo.classList.add('todo-item');
                todoDiv.appendChild(newTodo);

                const completedButton = document.createElement('button');
                completedButton.innerHTML = '<i class="fas fa-check"></i>';
                completedButton.classList.add('complete-btn');
                todoDiv.appendChild(completedButton);

                const trashButton = document.createElement('button');
                trashButton.innerHTML = '<i class="fas fa-trash"></i>';
                trashButton.classList.add('trash-btn');
                todoDiv.appendChild(trashButton);

                todoList.appendChild(todoDiv);
            });
        }

        function removeLocalTodos(todoDiv) {
            let todos = localStorage.getItem('todosData') ? JSON.parse(localStorage.getItem('todosData')) : [];
            const todoText = todoDiv.querySelector('.todo-item').innerText;
            todos = todos.filter(todo => todo.text !== todoText);
            localStorage.setItem('todosData', JSON.stringify(todos));
        }

        function updateLocalTodos() {
            let todos = [];
            const todoItems = document.querySelectorAll('.todo');
            todoItems.forEach(function(item) {
                todos.push({
                    text: item.children[0].innerText,
                    completed: item.classList.contains('completed')
                });
            });
            localStorage.setItem('todosData', JSON.stringify(todos));
        }
    </script>
</body>
</html>
